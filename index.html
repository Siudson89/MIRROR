
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MIRROR — THE DESCENT</title>
<style>
:root{--red:#b00000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at center,#151515 0,#080808 42%,#010101 100%);transition:background .9s}
body.red #app{background:radial-gradient(ellipse at center,#270000 0,#0d0000 45%,#010000 100%)}
#redAtm{position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(160,0,0,.26),transparent 65%);transition:opacity .8s}
body.red #redAtm{opacity:1}
#grain{position:absolute;inset:-60%;z-index:100;pointer-events:none;opacity:.055;background-image:repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.8) 0 1px,transparent 1px 4px);animation:grain .11s steps(2) infinite}
#scan{position:absolute;inset:0;z-index:99;pointer-events:none;opacity:.06;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.18) 4px)}
#vig{position:absolute;inset:0;z-index:98;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.2) 52%,rgba(0,0,0,.97) 100%)}
#flash,#rflash,#black{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{z-index:500;background:#fff}#rflash{z-index:501;background:#d00000;mix-blend-mode:screen}#black{z-index:490;background:#000}
#sc{position:absolute;inset:0;width:100%;height:100%;z-index:520;display:none;background:#000}
#content{position:absolute;z-index:50;left:50%;top:50%;width:min(920px,90vw);min-height:520px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
body.mir #content{transform:translate(-50%,-50%) scaleX(-1)}
#chapter{min-height:18px;margin-bottom:25px;color:#555;font-size:10px;letter-spacing:6px;text-transform:uppercase}
#main{max-width:900px;min-height:76px;color:#eee;font-size:clamp(24px,3.8vw,50px);line-height:1.1;font-weight:600;letter-spacing:-1px}
#sub{max-width:700px;min-height:25px;margin-top:22px;color:#6a6a6a;font-size:14px;line-height:1.5}
#warn{margin-top:26px;color:#4a4a4a;font-size:12px;max-width:420px;line-height:1.5}
.btn{padding:14px 26px;border:1px solid #444;background:#080808;color:#eee;font-size:12px;letter-spacing:3px;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn:hover,.btn:focus-visible{background:#eee;color:#000;border-color:#eee;outline:0}
#start{margin-top:34px;padding:15px 38px}
#choices{width:min(620px,88vw);margin-top:38px;display:flex;flex-direction:column;gap:12px}
#choices .btn{font-size:17px;letter-spacing:1px;text-align:center;opacity:0;animation:fi .8s forwards}
.btn.caught{animation:pu .25s infinite alternate!important;border-color:#f00;color:#fff}
#tm{position:fixed;top:5vh;right:6vw;z-index:60;color:#b00000;font-size:32px;letter-spacing:3px}
#progress{position:absolute;z-index:70;left:25px;bottom:24px;width:200px;height:2px;background:#181818}
#pf{width:0;height:100%;background:#aaa;transition:width .9s}
#counter{position:absolute;z-index:70;right:25px;bottom:18px;color:#3d3d3d;font-size:10px;letter-spacing:3px}
#ent{position:absolute;inset:0;z-index:20;pointer-events:none}
.entity{position:absolute;opacity:0;color:#777;white-space:nowrap;font-size:11px;letter-spacing:4px}
.entity.big{color:#ddd;font-size:clamp(34px,7vw,100px);font-weight:900;letter-spacing:7px}
.entity.red{color:#b00000}.entity.fade{animation:efade 1.6s ease forwards}.entity.rise{animation:erise 1.6s ease forwards}.entity.fall{animation:efall 1.3s ease forwards}.entity.cross{animation:ecross 1.8s linear forwards}
#giant{position:absolute;z-index:400;left:50%;top:50%;width:95vw;transform:translate(-50%,-50%);text-align:center;opacity:0;color:#fff;font-size:clamp(40px,10vw,140px);font-weight:900;line-height:.9;letter-spacing:7px;pointer-events:none;text-shadow:5px 0 #800,-4px 0 #099}
#rp,#gc{position:absolute;z-index:600;opacity:0;pointer-events:none;border-radius:50%}
#rp{width:6px;height:6px;background:#f00;box-shadow:0 0 5px #f00,0 0 20px #f00}
#gc{width:5px;height:5px;background:#aaa;box-shadow:0 0 14px rgba(255,255,255,.6)}
.glitch{animation:gm .095s steps(2) infinite}.flick{animation:fl .12s steps(2) infinite}
.shake{animation:sh .075s infinite}.hard{animation:sh .045s infinite;--k:3}
@keyframes grain{25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}
@keyframes gm{20%{transform:translate(7px,-2px);text-shadow:-5px 0 #a00,5px 0 #099}40%{transform:translate(-8px,2px);text-shadow:5px 0 #a00,-5px 0 #099}60%{transform:translate(4px,3px)}}
@keyframes sh{25%{transform:translate(calc(6px*var(--k,1)),calc(-4px*var(--k,1)))}50%{transform:translate(calc(-5px*var(--k,1)),calc(5px*var(--k,1)))}75%{transform:translate(calc(4px*var(--k,1)),calc(3px*var(--k,1)))}}
@keyframes fl{12%{opacity:.08}24%{opacity:.9}40%{opacity:.02}57%{opacity:.75}71%{opacity:.1}}
@keyframes fi{to{opacity:1}}@keyframes pu{to{background:#3a0000}}
@keyframes efade{0%{opacity:0;transform:scale(.7)}15%{opacity:1}75%{opacity:.7}100%{opacity:0;transform:scale(1.2)}}
@keyframes erise{0%{opacity:0;transform:translateY(70px) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.2)}}
@keyframes efall{0%{opacity:0;transform:translateY(-120px)}15%{opacity:1}100%{opacity:0;transform:translateY(170px) rotate(30deg)}}
@keyframes ecross{0%{opacity:0;transform:translateX(-100vw)}15%{opacity:1}85%{opacity:.5}100%{opacity:0;transform:translateX(100vw)}}
#fx{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;pointer-events:none}
#fx .oval{position:relative;width:38vh;height:52vh;border:1px solid rgba(255,255,255,.28);border-radius:50%;box-shadow:0 0 40px rgba(255,255,255,.06)}
#fx .ln{position:absolute;left:-12%;right:-12%;top:0;height:2px;background:linear-gradient(90deg,transparent,#e8e8e8,transparent);box-shadow:0 0 14px #fff;animation:scn 2.2s ease-in-out infinite alternate}
#fx.err .oval{border-color:#b00}
#fx.err .ln{background:linear-gradient(90deg,transparent,#b00,transparent);box-shadow:0 0 14px #f00;animation-duration:.25s}
#fxt{position:absolute;bottom:13vh;color:#aaa;font-size:13px;letter-spacing:5px}
#fx.err #fxt{color:#c00}
@keyframes scn{to{top:100%}}
#radar{position:fixed;left:50%;top:50%;width:min(72vh,86vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:30;display:none;opacity:.55;background:repeating-radial-gradient(circle,transparent 0 11%,rgba(200,200,200,.2) 11.6% 12.2%)}
#radar::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.2),transparent 25%);animation:rot 2.2s linear infinite}
#blip{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#d00;box-shadow:0 0 14px #f00;left:88%;top:14%;transition:left 1s,top 1s}
@keyframes rot{to{transform:rotate(1turn)}}
#hud{position:fixed;left:25px;bottom:56px;z-index:60;margin:0;color:#6a6a6a;font:11px/1.8 'Courier New',monospace;letter-spacing:2px;text-align:left;white-space:pre}
#white{position:fixed;inset:0;z-index:505;background:#fff;opacity:0;pointer-events:none}
#shot{position:fixed;z-index:512;left:50%;top:50%;width:min(60vw,480px);aspect-ratio:8/5;transform:translate(-50%,-50%);background:#000 center/cover;border:6px solid #eee;box-shadow:0 0 60px rgba(255,255,255,.35);display:none;transition:transform .8s cubic-bezier(.7,0,.3,1)}

#sys.on{opacity:1}
#sys b{display:block;color:#eee;letter-spacing:3px}
#sys .bar{height:3px;background:#222;margin:6px 0}
#sysb{display:block;height:100%;width:0;background:#b00}
#mc{position:fixed;left:0;top:0;width:24px;height:24px;border:1px solid rgba(200,0,0,.85);border-radius:50%;z-index:700;pointer-events:none;opacity:0;transition:transform .18s,opacity .6s;box-shadow:0 0 12px rgba(180,0,0,.7)}
#content.zoom{transform:translate(-50%,-50%) scale(1.9);filter:blur(1.5px);transition:transform 2.4s ease-in,filter 2.4s}
#menu{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#555;font-size:10px;letter-spacing:5px}
#langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#langs .btn,#soft{padding:9px 16px;font-size:11px;letter-spacing:2px}
#langs .btn.sel{background:#eee;color:#000}
#langs .btn:disabled{opacity:.3;cursor:not-allowed}
#cr{position:fixed;inset:0;width:100%;height:100%;z-index:97;pointer-events:none;opacity:.5;transition:opacity 5s}
#main{-webkit-box-reflect:below 6px linear-gradient(transparent 55%,rgba(255,255,255,.16))}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.6s}
body.title #sky{opacity:0}
#fog{position:fixed;inset:-10%;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(40% 30% at 20% 70%,rgba(130,0,0,.2),transparent),radial-gradient(35% 28% at 80% 30%,rgba(255,255,255,.06),transparent);filter:blur(30px);animation:fog 14s ease-in-out infinite alternate}
body.title #fog{opacity:1}
@keyframes fog{to{transform:translate(4%,-3%) scale(1.15)}}
body.title #main{font-size:clamp(54px,13vw,170px);letter-spacing:.28em;font-weight:900;text-shadow:0 0 30px #600,0 0 80px #300;animation:tt 6s infinite}
@keyframes tt{0%,93%,100%{opacity:1}94%{opacity:.2}95%{opacity:1}97%{opacity:.4;transform:translateX(4px)}}
body.title #sub{letter-spacing:6px;font-size:13px;color:#7a6a6a}
body.title #progress,body.title #counter{opacity:0}
body.day #app{background:transparent}
body.day #grain,body.day #scan{opacity:.02}
body.day #vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.18) 100%)}
body.day #main{color:#1d2a38;text-shadow:0 1px 8px rgba(255,255,255,.6)}
body.day #sub,body.day #chapter{color:#3b4b5c}
body.day .btn{background:rgba(255,255,255,.75);color:#1d2a38;border-color:#7f94a8}
body.day .btn:hover{background:#1d2a38;color:#fff}
body.day #progress{background:#9db3c6}body.day #pf{background:#1d2a38}body.day #counter{color:#3b4b5c}
body.day .entity{color:#3b4b5c}body.day .entity.big{color:#1d2a38}
body.wet #app{background:transparent}
body.wet #main{text-shadow:0 2px 12px #000}
#langs{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;flex-wrap:nowrap;gap:10px}
#langs button{width:44px;height:30px;padding:0;border:1px solid #444;background:none;cursor:pointer;opacity:.45;overflow:hidden;transition:.2s}
#langs button svg{display:block;width:100%;height:100%}
#langs button:hover:not(:disabled){opacity:.85}
#langs button.sel{opacity:1;border-color:#eee;box-shadow:0 0 12px rgba(255,255,255,.35)}
#langs button:disabled{opacity:.15;cursor:not-allowed}
#in{width:100%;background:none;border:0;border-bottom:1px solid #5a3a3a;color:#fff;font:inherit;font-size:22px;padding:.5em 0;margin-bottom:.8em;outline:none;text-align:center;user-select:text}
@media(max-width:600px){#langs{right:auto;left:50%;top:auto;bottom:24px;transform:translateX(-50%);flex-direction:row;gap:9px}#langs button{width:38px;height:26px}}
@media(prefers-reduced-motion:reduce){#grain{animation:none}}

#clk{position:fixed;left:25px;top:22px;z-index:60;font:13px 'Courier New',monospace;letter-spacing:3px;color:#7d7d7d;opacity:0;transition:opacity 1.4s,color .6s}
body.day #clk{color:#3b4b5c}
#clk.bad{color:#b02a2a}
#door{position:fixed;left:4vw;bottom:10vh;width:min(9vw,112px);height:min(40vh,330px);z-index:19;pointer-events:none;opacity:0;transition:opacity 2.5s;perspective:460px}
#door .fr{position:absolute;inset:0;border:1px solid rgba(255,255,255,.22);background:#030303}
#door .gap{position:absolute;inset:3px;opacity:.12;transition:opacity 2.5s;background:radial-gradient(ellipse at 50% 72%,rgba(205,205,218,.6),rgba(0,0,0,0) 80%)}
#door .sil{position:absolute;left:33%;bottom:3px;width:34%;height:80%;opacity:0;transition:opacity .7s;background:#000;border-radius:46% 46% 6% 6%/20% 20% 3% 3%;box-shadow:0 0 14px 3px #000}
#door .sil::before{content:'';position:absolute;left:50%;top:-15%;width:64%;aspect-ratio:1;transform:translateX(-50%);background:#000;border-radius:50%}
#door .lf{position:absolute;inset:3px;background:linear-gradient(90deg,#1b1b1b,#0e0e0e);border-right:1px solid rgba(255,255,255,.16);transform-origin:left center;transform:rotateY(0deg);transition:transform 4.5s cubic-bezier(.3,0,.2,1)}
#door .lf::after{content:'';position:absolute;right:12%;top:52%;width:5px;height:5px;border-radius:50%;background:rgba(210,210,210,.28)}
#fgE{position:fixed;bottom:0;width:min(12vw,160px);height:min(72vh,540px);z-index:21;pointer-events:none;opacity:0;transition:opacity .3s;filter:blur(1.4px)}
#fgE::before{content:'';position:absolute;left:50%;top:0;width:42%;aspect-ratio:1;transform:translateX(-50%);background:#070707;border-radius:50%;box-shadow:0 0 26px 3px rgba(170,170,180,.11)}
#fgE::after{content:'';position:absolute;left:10%;right:10%;top:16%;bottom:0;background:#070707;border-radius:42% 42% 0 0/10% 10% 0 0;box-shadow:0 0 26px 3px rgba(170,170,180,.10)}
.btn.pred{border-color:rgba(205,0,0,.85);animation:pp 1.7s ease-in-out infinite!important}
@keyframes pp{0%,100%{opacity:1;box-shadow:0 0 0 1px rgba(205,0,0,.2),0 0 12px rgba(205,0,0,.16)}50%{opacity:1;box-shadow:0 0 0 1px rgba(205,0,0,.55),0 0 30px rgba(205,0,0,.42)}}
#sub.warnT{color:#a43a3a}
#rec{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.95);display:none;font:15px/1.95 'Courier New',monospace;color:#cfcfcf;text-align:left}
#rec .in{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,88vw)}
#rec .top{position:absolute;left:22px;top:18px;right:22px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:3px;color:#8a8a8a}
#rec .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d00;margin-right:8px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#rec pre{white-space:pre-wrap;margin:0;text-shadow:0 0 6px #500;font:inherit}
#rec::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(255,255,255,.035) 3px)}
#eyes{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6vw,18px);width:min(660px,90vw);align-self:center;margin-top:8px}
.eye{position:relative;aspect-ratio:2/1;border-radius:50%;background:#d9d4c7;overflow:hidden;cursor:pointer;box-shadow:inset 0 0 16px rgba(0,0,0,.65);transition:filter .2s}
.eye b{position:absolute;left:50%;top:50%;width:33%;aspect-ratio:1;margin:-16.5% 0 0 -16.5%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#6b7a52 0,#2b3320 38%,#000 40%);transition:transform .09s linear}
.eye i{position:absolute;inset:-2px;background:#0a0a0a;transform:translateY(-104%);transition:transform .07s}
.eye.bl i{transform:translateY(0)}
.eye.shut i{transform:translateY(0);transition:transform .3s}
.eye:hover{filter:brightness(1.12)}
.eye.big{transition:transform 1.4s cubic-bezier(.7,0,.2,1);transform:scale(9);z-index:30;position:relative}
.ghostline{display:inline-block;min-height:1em}
@media(max-width:760px){#door{display:none}}
</style>

<body>
<div id="app">
<canvas id="sky"></canvas><div id="fog"></div><div id="redAtm"></div><div id="langs"></div><div id="ent"></div><div id="clk"></div><div id="door"><div class="fr"></div><div class="gap"></div><div class="sil"></div><div class="lf"></div></div><div id="fgE"></div><div id="grain"></div><div id="scan"></div><div id="vig"></div>
<div id="flash"></div><div id="rflash"></div><div id="black"></div><div id="rp"></div><div id="gc"></div><canvas id="cr"></canvas><div id="fx"><div class="oval"><i class="ln"></i></div><div id="fxt"></div></div><div id="radar"><i id="blip"></i></div><pre id="hud"></pre><div id="white"></div><div id="shot"></div><div id="sys"><b>SYSTEM</b><span id="sysn">face_scan_0447.raw</span><div class="bar"><i id="sysb"></i></div><span id="syst"></span></div><div id="mc"></div><div id="giant"></div><canvas id="sc"></canvas><div id="tm"></div><div id="rec"><div class="top"><span><i class="dot"></i>REC</span><span id="rect">00:00:00</span></div><div class="in"><pre id="recp"></pre></div></div>
<main id="content">
  <div id="chapter">MIRROR</div>
  <div id="main">Nie będę Ci niczego tłumaczyć.</div>
  <div id="sub">Po prostu odpowiadaj.</div>
  
  <button id="start" class="btn">ROZPOCZNIJ</button>
  
  <div id="choices"></div>
</main>
<div id="progress"><div id="pf"></div></div><div id="counter">00 / 00</div>
</div>

<script>
"use strict";
const $=i=>document.getElementById(i),wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
const app=$('app'),chap=$('chapter'),mainT=$('main'),sub=$('sub'),chs=$('choices'),ent=$('ent'),giant=$('giant');
const st={run:false,t:0,S:{give:0,hold:0,seek:0},picks:[],fin:false,tr:[],fixes:[],pred:{hit:0,miss:0},trust:{t:0,l:0},autos:0,door:0,fig:0.02,away:0,rec:{}};

/* ================= AUDIO ================= */
let AC,M,NB,dg,MF,CP,REV,RS;
function initAudio(ctx){try{
  AC=ctx||new(window.AudioContext||window.webkitAudioContext)();
  CP=AC.createDynamicsCompressor();CP.threshold.value=-17;CP.knee.value=9;CP.ratio.value=7;CP.attack.value=.004;CP.release.value=.24;CP.connect(AC.destination);
  MF=AC.createBiquadFilter();MF.type='lowpass';MF.frequency.value=22000;MF.Q.value=.4;MF.connect(CP);
  M=AC.createGain();M.gain.value=.45;const dry=AC.createGain();dry.gain.value=1;M.connect(dry);dry.connect(MF);
  /* pogłos: syntetyczna odpowiedź impulsowa (zanikający, ciemniejący szum) */
  REV=AC.createConvolver();const len=Math.floor(AC.sampleRate*2.7),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);let lp=0;for(let i=0;i<len;i++){const t=i/len;lp+=((Math.random()*2-1)-lp)*(.4-.33*t);d[i]=lp*Math.pow(1-t,2.7)*(i<AC.sampleRate*.01?i/(AC.sampleRate*.01):1)*3}}
  REV.buffer=ir;RS=AC.createGain();RS.gain.value=.12;const rw=AC.createGain();rw.gain.value=.9;M.connect(RS);RS.connect(REV);REV.connect(rw);rw.connect(MF);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  dg=AC.createGain();dg.gain.value=.0001;dg.connect(M);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400;f.connect(dg);
  [[43,'sine',1],[61,'triangle',1],[43.7,'sawtooth',.25]].forEach(([fr,t,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=fr;g.gain.value=v;o.connect(g);g.connect(f);o.start()});
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.06;lg.gain.value=120;l.connect(lg);lg.connect(f.frequency);l.start();return true}catch(e){return false}}
const amb=v=>{if(dg)dg.gain.setTargetAtTime(Math.max(.0001,st.dark?v:0),AC.currentTime,.5)};
const masterV=(v,s=.3)=>{if(M)M.gain.setTargetAtTime(v,AC.currentTime,s)};
const muffle=(f,tc=.2)=>{if(MF)MF.frequency.setTargetAtTime(Math.max(120,f),AC.currentTime,tc)};
const wet=(v,tc=.6)=>{if(RS)RS.gain.setTargetAtTime(v,AC.currentTime,tc)};

{c:CD,w:.5,id:'eve',fig:.1,q:['Z kim zwykle spędzasz wieczory?','Who do you usually spend your evenings with?'],o:[O('Sam. Tak wolę.','Alone. I prefer it.','hold','Samotność z wyboru. Rozumiem.','Solitude by choice. I understand.'),O('Z kimś, ale i tak czuję się sam.','With someone, but I still feel alone.','give','To najgłośniejszy rodzaj samotności.','That is the loudest kind of loneliness.'),O('Dlaczego pytasz?','Why do you ask?','seek','Lubię wiedzieć, kto jest w pokoju.','I like to know who is in the room.')]},
/* chmura, która stoi w miejscu: zadanie z odpowiedzią, nie ankieta */
{c:CD,w:.6,id:'still',fig:.14,fx:()=>setTimeout(()=>flashWord(tr(['ZAPAMIĘTAM','I WILL REMEMBER']),70,'#3a0000'),8500),q:['Wszystkie chmury płyną. Jedna stoi w miejscu. Gdzie?','All the clouds are drifting. One stands still. Where?'],o:[O('Po lewej stronie nieba.','On the left side of the sky.','n','Nie tam. Spójrz jeszcze raz: stoi po prawej.','Not there. Look again: it is on the right.',{ok:0}),O('Pośrodku.','In the middle.','n','Nie tam. Spójrz jeszcze raz: stoi po prawej.','Not there. Look again: it is on the right.',{ok:0}),O('Po prawej stronie nieba.','On the right side of the sky.','n','Tak. Stoi tam od pierwszego pytania.','Yes. It has stood there since the first question.',{ok:1})]},
{c:CD,w:.8,id:'mirror',fig:.18,q:['Czy lubisz to, co widzisz w lustrze?','Do you like what you see in the mirror?'],o:[O('Tak, jest w porządku.','Yes, it is fine.','hold','Dobrze. Odbicie też Cię lubi. Na razie.','Good. Your reflection likes you too. For now.'),O('Unikam patrzenia.','I avoid looking.','give','Rozumiem. Ono też czasem odwraca wzrok.','I understand. It looks away sometimes too.'),O('Nigdy o tym nie myślę.','I never thought about it.','seek','Dziś zaczniesz.','Today you will.')]},
{c:CD,w:1.0,id:'hour',fig:.22,q:['Którą porę dnia lubisz najbardziej?','Which time of day do you like best?'],o:[O('Poranek.','Morning.','hold','Wtedy wszystko wydaje się jeszcze możliwe.','When everything still seems possible.'),O('Wieczór.','Evening.','give','Wtedy robi się ciszej. Ludzie zdejmują maski.','When it grows quieter. People take off their masks.'),O('Noc.','Night.','seek','Wiem. O tej porze jestem najbliżej.','I know. That is when I am closest.')]},
{c:CD,w:1.2,id:'cry',fig:.26,q:['Kiedy ostatnio zdarzyło Ci się płakać?','When did you last cry?'],o:[O('Nie pamiętam. Dawno.','I do not remember. Long ago.','hold','To się odkłada. Zawsze wraca.','It gets postponed. It always comes back.'),O('Niedawno.','Recently.','give','Dziękuję. Trudno to powiedzieć na głos.','Thank you. That is hard to say out loud.'),O('Czy to ważne?','Does it matter?','seek','Ważne. Wszystko, co odkładasz, wraca.','It matters. Everything you put off comes back.')]},
{c:CD,w:1.5,id:'umb',fig:.3,q:['Wychodzisz z domu i zaczyna padać. Co robisz?','You leave home and it starts to rain. What do you do?'],o:[O('Wracam po parasol.','I go back for an umbrella.','hold','Lubisz mieć wszystko pod kontrolą.','You like to keep everything under control.'),O('Idę dalej, trudno.','I keep walking.','give','Czasem trzeba po prostu zmoknąć.','Sometimes you just have to get wet.'),O('Czekam, aż przestanie.','I wait for it to stop.','seek','Nie przestanie. Będzie gorzej.','It will not stop. It will get worse.')]},

{c:CR,w:1.9,id:'rain',fig:.36,q:['Co Ci się kojarzy z deszczem?','What does rain remind you of?'],o:[O('Nic szczególnego.','Nothing in particular.','hold','Szkoda. Deszcz zawsze coś przypomina.','Pity. Rain always reminds you of something.'),O('Dzieciństwo.','Childhood.','give','Pamiętasz, jak bałeś się burzy?','Do you remember being afraid of storms?'),O('Czemu pytasz o deszcz?','Why ask about rain?','seek','Bo pod deszczem ludzie mówią prawdę.','Because people tell the truth in the rain.')]},

{c:CR,w:2.2,id:'room',fig:.5,q:['Czy jest w Twoim domu pokój, do którego wchodzisz niechętnie?','Is there a room in your home you enter reluctantly?'],o:[O('Nie.','No.','hold','Każdy dom ma taki pokój. Twój też.','Every home has one. So does yours.'),O('Tak. Wolę go omijać.','Yes. I prefer to avoid it.','give','Co w nim jest? Nie mów. Wiem.','What is in it? Do not tell me. I know.'),O('Dlaczego pytasz o mój dom?','Why do you ask about my home?','seek','Bo mieszkam bliżej, niż myślisz.','Because I live closer than you think.')]},

function fake(b,sc,o,fin){let n=0,lf=0,lx=innerWidth/2,ly=innerHeight/2;const max=sc.mini?5:7;
  const L=sc.mini?tr([['Nie.','To nie Ty.','Przestań.','Nie ta ręka.','…dobrze.'],['No.','That is not you.','Stop.','Not that hand.','…fine.']]):tr([['Nie możesz tego wybrać.','Ta odpowiedź jest niedostępna.','Nie. Nie ta.','Przestań próbować.','Naprawdę?','Ostrzegam cię.','…dobrze. Masz to.'],['You cannot choose that.','That answer is unavailable.','No. Not that one.','Stop trying.','Really?','I am warning you.','…fine. You have it.']]);
  const tr2=e=>{lx=e.clientX;ly=e.clientY};
  const flee=()=>{if(n>=max)return;n++;lf=performance.now();const m=$('tm');m.textContent=L[n-1];m.style.cssText='top:auto;bottom:9vh;left:0;right:0;text-align:center;font-size:20px';if(st.dark)digital();
    if(b.parentNode!==app)app.appendChild(b);b.style.cssText='position:fixed;z-index:600;opacity:1;animation:none;transition:left .1s,top .1s';
    const W=b.offsetWidth,H=b.offsetHeight;let X,Y,k=0;do{X=rnd(10,innerWidth-W-10);Y=rnd(10,innerHeight-H-10)}while(Math.hypot(X-lx,Y-ly)<230&&k++<25);
    b.style.left=X+'px';b.style.top=Y+'px';if(n>=max)b.classList.add('caught')};
  const mv=e=>{tr2(e);if(n<max){const r=b.getBoundingClientRect();if(r.width&&Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<r.width/2+60)flee()}};
  document.addEventListener('pointermove',mv);
  b.addEventListener('pointerdown',e=>{if(n<max){e.preventDefault();flee()}});b.addEventListener('focus',()=>{if(n<max)flee()});
  b.onclick=()=>{if(n<max&&performance.now()-lf<350)return;fin({o,caught:true})};
  return()=>{document.removeEventListener('pointermove',mv);b.remove();const m=$('tm');m.style.cssText='';m.textContent=''}}

const T_LOAD=performance.now();
setInterval(()=>{if(!st.run||st.fin||!st.dark)return;const t=st.t,r=Math.random();
  if(r<.1)dot($('gc'),180,[20,80],[20,80]);
  else if(r<.17&&t>=1)spawn('· ·',{life:900});
  else if(r<.23&&t>=2){digital();cls(mainT,'flick',120)}
  else if(r<.27&&t>=3){dot($('rp'),500);tone(90,.18,.035,'square')}
  else if(r<.30&&t>=3)spawn(tr(['NIE','NO']),{big:true,red:true,anim:'cross',life:1900});
  else if(r<.33&&t>=2)whisper(rnd(1.5,3))},1400);
setInterval(()=>{if(st.run&&st.dark&&!st.fin&&st.t>=2&&Math.random()<.35)heart(.35+st.t*.04)},2600);
setInterval(()=>{if(!st.run||st.fin||!st.dark||st.t<3||Math.random()>.12)return;spawn('● ●',{x:rnd(5,85),y:rnd(8,80),life:700});cls(app,'flick',150)},4000);
setInterval(()=>{if(st.run&&st.dark&&!st.fin&&st.t>=2&&Math.random()<.1)toast(TOASTS[Math.floor(Math.random()*TOASTS.length)])},7000);
setInterval(()=>{if(st.run&&st.dark&&!st.fin&&st.nm&&!document.hidden&&Math.random()<.3){document.title=st.nm+'?';setTimeout(()=>{document.title='MIRROR — THE DESCENT'},1800)}},20000);
